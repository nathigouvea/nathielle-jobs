    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      --green: #10B981; --green-dim: rgba(16,185,129,0.12);
      --amber: #F59E0B; --amber-dim: rgba(245,158,11,0.12);
      --red: #EF4444; --red-dim: rgba(239,68,68,0.12);
      --blue: #3B82F6; --blue-dim: rgba(59,130,246,0.12);
      --grey: #6B7280; --grey-dim: rgba(107,114,128,0.12);
      --purple: #8B5CF6; --purple-dim: rgba(139,92,246,0.12);
      --text: #F1F0F5; --text-muted: #9CA3AF; --text-dim: #6B7280;
      --radius: 14px; --radius-sm: 8px;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; }

    header { padding: 32px 24px 0; max-width: 1400px; margin: 0 auto; }
    .header-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 6px; }
    h1 { font-size: 1.5rem; font-weight: 700; }
    h1 span { color: var(--violet-light); }
    .header-meta { font-size: 0.8rem; color: var(--text-dim); }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; max-width: 1400px; margin: 20px auto 0; padding: 0 24px; }
    .stat { background: var(--bg2); border: 1px solid var(--glass-border); border-radius: var(--radius); padding: 14px; text-align: center; }
    .stat-num { font-size: 1.8rem; font-weight: 700; }
    .stat-label { font-size: 0.68rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }
    .stat.green .stat-num { color: var(--green); }
    .stat.amber .stat-num { color: var(--amber); }
    .stat.red .stat-num { color: var(--red); }
    .stat.blue .stat-num { color: var(--blue); }
    .stat.purple .stat-num { color: var(--purple); }
    .stat.grey .stat-num { color: var(--grey); }

    .urgent-banner { max-width: 1400px; margin: 16px auto 0; padding: 0 24px; }
    .urgent-inner { background: rgba(245,158,11,0.07); border: 1px solid rgba(245,158,11,0.25); border-radius: var(--radius); padding: 14px 18px; }
    .urgent-title { font-size: 0.8rem; font-weight: 600; color: var(--amber); margin-bottom: 8px; }
    .urgent-items { display: flex; flex-wrap: wrap; gap: 8px; }
    .urgent-chip { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.25); border-radius: 20px; padding: 4px 12px; font-size: 0.73rem; color: var(--amber); }

    .controls { max-width: 1400px; margin: 16px auto 0; padding: 0 24px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .filter-btn { background: var(--bg2); border: 1px solid var(--glass-border); border-radius: 20px; padding: 6px 14px; font-size: 0.78rem; color: var(--text-muted); cursor: pointer; transition: all .15s; font-family: inherit; }
    .filter-btn:hover, .filter-btn.active { background: var(--violet-dim); border-color: var(--violet); color: var(--violet-light); }
    .search-wrap { margin-left: auto; }
    .search-input { background: var(--bg2); border: 1px solid var(--glass-border); border-radius: 20px; padding: 6px 14px; font-size: 0.78rem; color: var(--text); font-family: inherit; outline: none; width: 200px; transition: border-color .15s; }
    .search-input:focus { border-color: var(--violet); }
    .search-input::placeholder { color: var(--text-dim); }

    main { max-width: 1400px; margin: 16px auto 40px; padding: 0 24px; }
    .section-title { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); margin: 28px 0 12px; display: flex; align-items: center; gap: 8px; }
    .section-title::after { content: ''; flex: 1; height: 1px; background: var(--glass-border); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }

    .card { background: var(--bg2); border: 1px solid var(--glass-border); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 10px; transition: border-color .15s, background .15s; position: relative; overflow: hidden; }
    .card:hover { border-color: rgba(255,255,255,0.14); background: var(--bg3); }
    .card.urgent-card { border-color: rgba(245,158,11,0.3); }
    .card.urgent-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--amber); }

    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .company { font-weight: 600; font-size: 0.95rem; }
    .role { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 500; white-space: nowrap; flex-shrink: 0; }
    .badge.submitted  { background: var(--green-dim); color: var(--green); }
    .badge.action     { background: var(--amber-dim); color: var(--amber); }
    .badge.login      { background: var(--blue-dim); color: var(--blue); }
    .badge.found      { background: var(--purple-dim); color: var(--purple); }
    .badge.closed     { background: var(--grey-dim); color: var(--grey); }

    .urgent-tag { display: inline-flex; align-items: center; gap: 4px; background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.25); border-radius: 6px; padding: 2px 8px; font-size: 0.68rem; color: var(--amber); font-weight: 600; }

    .card-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .meta-pill { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 6px; padding: 2px 8px; font-size: 0.7rem; color: var(--text-dim); }
    .meta-pill.salary { color: var(--green); border-color: rgba(16,185,129,0.2); background: rgba(16,185,129,0.05); }

    .notes { font-size: 0.78rem; color: var(--text-muted); line-height: 1.5; background: rgba(255,255,255,0.02); border-radius: var(--radius-sm); padding: 8px 10px; border-left: 2px solid var(--glass-border); }
    .notes.urgent-notes { border-left-color: var(--amber); }

    .card-link { font-size: 0.75rem; color: var(--violet-light); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; opacity: 0.8; transition: opacity .15s; }
    .card-link:hover { opacity: 1; }

    .empty { text-align: center; padding: 40px; color: var(--text-dim); font-size: 0.85rem; }
    .hidden { display: none !important; }

    footer { text-align: center; padding: 24px; color: var(--text-dim); font-size: 0.75rem; border-top: 1px solid var(--glass-border); margin-top: 20px; }
    footer a { color: var(--violet-light); text-decoration: none; }

    @media (max-width: 600px) {
      .stats { grid-template-columns: repeat(3, 1fr); }
      .grid { grid-template-columns: 1fr; }
      .search-wrap { width: 100%; }
      .search-input { width: 100%; }
    }
  </style>
</head>

    urgent:false

  {
    id:30, company:"Fuelerate", role:"CRO-Focused Web Designer",
    status:"closed", date:"2026-03-17", method:"LinkedIn", salary:"",
    url:"https://www.linkedin.com/jobs/view/4361480726/",
    notes:"No longer accepting applications.",
    urgent:false
  },
];

const STATUS_LABEL = { submitted:"✅ Submitted", action:"⚠️ Needs action", login:"🔑 Needs login", found:"🔍 Found", closed:"❌ Closed" };
const SECTION_ORDER = ["submitted","action","login","found","closed"];
const SECTION_TITLES = { submitted:"Submitted", action:"Needs your action", login:"Needs your login", found:"Found — in queue to apply", closed:"Closed / No longer accepting" };

let currentFilter = "all";
let searchQuery = "";

function render() {
  const main = document.getElementById("main-content");

  let filtered = JOBS.filter(j => {
    const matchFilter = currentFilter === "all" || j.status === currentFilter;
    const q = searchQuery.toLowerCase();
    const matchSearch = !q || j.company.toLowerCase().includes(q) || j.role.toLowerCase().includes(q) || j.notes.toLowerCase().includes(q);
    return matchFilter && matchSearch;
  });

  // counts (always full)
  const counts = { submitted:0, action:0, login:0, found:0, closed:0 };
  JOBS.forEach(j => counts[j.status]++);
  document.getElementById("cnt-submitted").textContent = counts.submitted;
  document.getElementById("cnt-action").textContent = counts.action;
  document.getElementById("cnt-login").textContent = counts.login;
  document.getElementById("cnt-found").textContent = counts.found;
  document.getElementById("cnt-closed").textContent = counts.closed;
  document.getElementById("cnt-total").textContent = JOBS.length;

  // urgent banner
  const urgents = JOBS.filter(j => j.urgent);
  const banner = document.getElementById("urgent-banner");
  if (urgents.length) {
    banner.style.display = "block";
    document.getElementById("urgent-items").innerHTML = urgents.map(j =>
      `<span class="urgent-chip">⚡ ${j.company}: ${j.urgentLabel}</span>`
    ).join("");
  }

  // cards
  let html = "";
  const sections = currentFilter === "all" ? SECTION_ORDER : [currentFilter];
  sections.forEach(sec => {
    const jobs = filtered.filter(j => j.status === sec);
    if (!jobs.length) return;
    html += `<div class="section-title">${SECTION_TITLES[sec]} <span style="color:var(--text-dim);font-weight:400;text-transform:none;letter-spacing:0;font-size:0.85em">(${jobs.length})</span></div><div class="grid">`;
    jobs.forEach(j => {
      html += `<div class="card ${j.urgent ? "urgent-card" : ""}">
        <div class="card-top">
          <div><div class="company">${j.company}</div><div class="role">${j.role}</div></div>
          <span class="badge ${j.status}">${STATUS_LABEL[j.status]}</span>
        </div>
        <div class="card-meta">
          <span class="meta-pill">📅 ${j.date}</span>
          <span class="meta-pill">🔗 ${j.method}</span>
          ${j.salary ? `<span class="meta-pill salary">💰 ${j.salary}</span>` : ""}
          ${j.urgent ? `<span class="urgent-tag">⚡ ${j.urgentLabel}</span>` : ""}
        </div>
        <div class="notes ${j.urgent ? "urgent-notes" : ""}">${j.notes}</div>
        ${j.url ? `<a href="${j.url}" target="_blank" class="card-link">Open listing ↗</a>` : ""}
      </div>`;
    });
    html += `</div>`;
  });

  if (!html) html = `<div class="empty">No applications match your search.</div>`;
  main.innerHTML = html;
}

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.filter;
    render();
  });
});

document.getElementById("search").addEventListener("input", e => {
  searchQuery = e.target.value;
  render();
});

render();
</script>
</body>
</html>
